<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- CENTERING, 2026-08-16 (David: the wordmark does not look centered in the
       Visit Smarter Way Wealth card). It was not: every element was laid out
       around x=88 inside a 200-wide box whose centre is x=100, and the ink ran
       y=6..63 inside an 80-tall box whose centre is y=40. Measured ink centre
       was (86.55, 34.5) — about 6.7% of the width left of true centre, which
       reads as ~25px of drift once the mark is set 384px wide. The artwork is
       unchanged; it has been translated +12 in x and +5.5 in y into the middle
       of its own viewBox, so anything that centres the FILE now centres the
       MARK. The two text anchors take an extra half letter-space (+1.5 and +1)
       because text-anchor="middle" centres the advance box, and the trailing
       letter-space after the final glyph is part of that box but is not ink —
       without the nudge the wordmark would sit that far left of the bars. -->

  <!-- Chart bars - Progressive green (light to dark, ending at brand green) -->
  <rect x="84" y="25.5" width="8" height="12" rx="1" fill="#66D980"/>
  <rect x="96" y="19.5" width="8" height="18" rx="1" fill="#33BF60"/>
  <rect x="108" y="11.5" width="8" height="26" rx="1" fill="#00A540"/>

  <!-- SMARTER text - Dark Gray, DM Sans Bold -->
  <text x="101.5" y="57.5" font-family="'DM Sans', sans-serif" font-size="18" font-weight="700" fill="#4A4A4A" text-anchor="middle" letter-spacing="3">SMARTER</text>

  <!-- WAY WEALTH text - Brand Green, DM Sans Regular -->
  <text x="101" y="68.5" font-family="'DM Sans', sans-serif" font-size="9" font-weight="400" fill="#00A540" text-anchor="middle" letter-spacing="2">WAY WEALTH</text>
</svg>
